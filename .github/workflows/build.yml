name: Build
# Builds sms.nro in the devkitPro image (the same image ./build.sh uses), and
# sms-eclipse.nro, Super Mario Eclipse (eclipse.yml), on every push and pull
# request, and uploads them as artifacts. A v* tag, or a manual run given a
# version, also publishes them together as a GitHub release: an SD-card-ready
# zip (switch/sms/sms.nro, switch/sms-eclipse/sms-eclipse.nro), the bare
# NROs, and gx_selftest.nro (the renderer's self-test, for diagnosis).
# NROs only: the NSPs need a console's keys (build them locally).
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag to create at this commit (for example v0.2.0); leave empty to build only'
        required: false
        default: ''
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
jobs:
  build:
    runs-on: ubuntu-24.04
    container: devkitpro/devkita64:latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Build sms.nro
        run: |
          set -euo pipefail
          # The job runs as root in the container; the checkout belongs to the runner.
          git config --global --add safe.directory '*'
          # Releases keep libnx's icon: no third-party art is redistributed.
          SMS_SWITCH_NATIVE=1 JOBS=$(nproc) ./build.sh -DSMS_SWITCH_ICON=default
      - name: Package
        run: |
          set -euo pipefail
          mkdir -p dist
          cp build/sms.nro build/gx_selftest.nro dist/
          {
            echo "sms-switch $(git rev-parse --short HEAD)"
            echo "sms-port $(git -C sms-port rev-parse --short HEAD)"
            echo "decomp $(git -C sms-port/decomp rev-parse --short HEAD)"
          } > dist/versions.txt
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: sms-switch
          path: |
            dist/sms.nro
            dist/gx_selftest.nro
            dist/versions.txt
          if-no-files-found: error

  eclipse:
    uses: ./.github/workflows/eclipse.yml

  release:
    needs: [build, eclipse]
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.version != '')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sms-switch
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: sms-eclipse
          path: dist
      - name: Package
        run: |
          set -euo pipefail
          mkdir -p sd/switch/sms sd/switch/sms-eclipse
          cp dist/sms.nro sd/switch/sms/
          cp dist/sms-eclipse.nro sd/switch/sms-eclipse/
          (cd sd && zip -r -9 ../dist/sms-switch.zip switch)
          ls -l dist
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.version }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          versions=$(cat dist/versions.txt dist/eclipse-versions.txt)
          cat > notes.md <<EOF
          Super Mario Sunshine PC port as Nintendo Switch homebrew, and Super Mario Eclipse on it. **No game data is included**: they play your own disc images.

          **Install:** extract \`sms-switch.zip\` to the root of the SD card. It holds \`switch/sms/sms.nro\`, Super Mario Sunshine: put your GMSE01 (North America, Rev 0) \`.iso\`, \`.gcm\` or \`.ciso\` in \`sdmc:/switch/sms/\`. And \`switch/sms-eclipse/sms-eclipse.nro\`, Super Mario Eclipse v1.1.0: put the GMSE04 image, which the mod's patch makes from your GMSE01 image, in \`sdmc:/switch/sms-eclipse/\`. Start them from the homebrew menu through title takeover (hold R while starting a game), not the album applet.

          This is an early build. \`sms.log\` beside each NRO records each run; please attach it to bug reports.

          \`sms-eclipse.nro\` contains the code of Super Mario Eclipse, BetterSunshineEngine and BetterSunshineMoveset (GPL-3.0), built from the revisions below, where their sources are.

          \`gx_selftest.nro\` is a diagnostic: run it from the same folder and it writes \`gx_selftest.log\` (renderer pixel checks).

          Built from:
          \`\`\`
          ${versions}
          \`\`\`
          EOF
          # v0.x releases are pre-releases until the build has run on a console.
          pre=()
          [[ "$TAG" == v0.* || "$TAG" == *-* ]] && pre=(--prerelease)
          gh release create "$TAG" --repo "$REPO" --target "$SHA" --title "sms-switch $TAG" \
            --notes-file notes.md "${pre[@]}" \
            dist/sms-switch.zip dist/sms.nro dist/sms-eclipse.nro dist/gx_selftest.nro
